[project]
name = "coding-agent"
version = "0.1.0"
description = "A controlled engineering coding agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph>=1.2.11",
    "mcp>=2.0,<3",
    "pydantic>=2.10.0",
    "typer>=0.16.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[project.scripts]
coding-agent = "coding_agent.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: launches a real local MCP server"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
